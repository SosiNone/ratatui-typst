[package]
name = "ratatui-typst-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Interactive capability explorer for ratatui-typst"
license = "MIT"
repository = "https://github.com/SosiNone/ratatui-typst"
publish = false

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
ratatui-typst = { path = ".." }
