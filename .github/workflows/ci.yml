name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  RUSTDOCFLAGS: '-D warnings'

jobs:
  latest-deps:
    name: Latest compatible dependencies
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update --verbose
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p ratatui-typst --example terminal -- --smoke

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: '1.92.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p ratatui-typst --example terminal -- --smoke
      - run: cargo run --locked -p ratatui-typst-demo -- --png output/preview.png
      - run: cargo doc --locked -p ratatui-typst --no-deps
      - run: cargo package --locked -p ratatui-typst
      - name: Test the extracted crate without the workspace demo
        run: cargo test --locked --manifest-path target/package/ratatui-typst-0.1.0/Cargo.toml --target-dir target
      - name: Check the extracted public consumer
        run: cargo run --locked --manifest-path target/package/ratatui-typst-0.1.0/Cargo.toml --target-dir target --example terminal -- --smoke
      # Extracted sources are disposable and confuse build-cache pruning.
      - name: Remove package verification artifacts before caching
        if: always()
        shell: pwsh
        run: |
          $workspaceRoot = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $packageRoot = Join-Path $workspaceRoot 'target/package'
          if (Test-Path -LiteralPath $packageRoot) {
            $packageRoot = (Resolve-Path -LiteralPath $packageRoot).Path
            $expectedRoot = [IO.Path]::GetFullPath((Join-Path $workspaceRoot 'target/package'))
            if ($packageRoot -ne $expectedRoot) { throw 'Unexpected package directory' }
            Remove-Item -LiteralPath $packageRoot -Recurse -Force
          }
